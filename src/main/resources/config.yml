# ============================================================
#                   SellerPlugin Config
# ============================================================

# GUI Settings
gui:
  title: "&6&lShop"          # Title of the GUI (supports color codes)
  pages: 3                   # Number of pages (1-10)
  rows: 5                    # Rows per page (1-6). Row 6 is always navigation.

# Items sold in the shop
# Format per item:
#   slot: <slot number within current page, starts at 0>
#   page: <page number, starts at 1>
#   material: <MATERIAL_NAME>
#   name: "<display name>"
#   lore:
#     - "line1"
#     - "line2"
#   buy-price: <price to buy, 0 = not buyable>
#   sell-price: <price to sell, 0 = not sellable>
#   amount: <stack size given on purchase>

items:

