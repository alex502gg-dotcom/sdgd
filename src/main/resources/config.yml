# Messages (supports color codes with &)
messages:
  buy-success: "&aYou bought &e{amount}x {item} &afor &6${price}&a!"
  sell-success: "&aYou sold &e{amount}x {item} &afor &6${price}&a!"
  not-enough-money: "&cYou don't have enough money! Need: &6${price}"
  not-enough-items: "&cYou don't have enough items to sell!"
  item-not-buyable: "&cThis item cannot be bought!"
  item-not-sellable: "&cThis item cannot be sold!"
  no-permission: "&cYou don't have permission to use this!"
  reload-success: "&aConfig reloaded successfully!"
  auto-sell-success: "&aAuto-sold &e{amount}x &aitem(s) for &6${price}&a!"
  auto-item-not-found: "&cSellable item #{item} was not found on page {page}."
  auto-usage: "&cUsage: /seller auto or /seller auto [page] [item]"
